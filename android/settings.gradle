pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

def loadMapboxDownloadsToken = {
    def props = new Properties()
    def localFile = new File(rootDir, "local.properties")
    if (localFile.exists()) {
        localFile.withInputStream { stream -> props.load(stream) }
    }
    def fromLocal = props.getProperty("MAPBOX_DOWNLOADS_TOKEN")
    if (fromLocal != null && !fromLocal.trim().isEmpty()) {
        return fromLocal.trim()
    }
    def fromEnv = System.getenv("MAPBOX_DOWNLOADS_TOKEN")
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    return providers.gradleProperty("MAPBOX_DOWNLOADS_TOKEN").orElse("").get()
}()

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://api.mapbox.com/downloads/v2/releases/maven")
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                password = loadMapboxDownloadsToken
            }
        }
        maven { url = uri("$rootDir/../node_modules/detox/Detox-android") }
        maven { url = uri("$rootDir/../node_modules/@notifee/react-native/android/libs") }
        maven { url = uri("https://www.jitpack.io") }
        maven { url = uri("https://central.sonatype.com/repository/maven-snapshots/") }
    }
}

rootProject.name = 'DriverTracking'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
