buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "29.0.14206865"
        kotlinVersion = "1.9.10"
        // Must be 21+ so SettingsClient/FusedLocation match device GMS (avoids IncompatibleClassChangeError).
        googlePlayServicesLocationVersion = "21.3.0"
        googlePlayServicesVersion = "21.3.0"
        playServicesLocationVersion = "21.3.0"
        playServicesVersion = "21.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

def loadMapboxDownloadsToken() {
    def props = new Properties()
    def localFile = rootProject.file("local.properties")
    if (localFile.exists()) {
        localFile.withInputStream { stream -> props.load(stream) }
    }
    def fromLocal = props.getProperty("MAPBOX_DOWNLOADS_TOKEN")
    if (fromLocal != null && !fromLocal.trim().isEmpty()) {
        return fromLocal.trim()
    }
    def fromEnv = System.getenv("MAPBOX_DOWNLOADS_TOKEN")
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    return project.findProperty("MAPBOX_DOWNLOADS_TOKEN") ?: ""
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                // Do not change the username — always "mapbox"
                username = "mapbox"
                password = loadMapboxDownloadsToken()
            }
        }
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }
    }
  configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion "2.1.20"
                }
            }
        }
    }
    configurations.all {
        resolutionStrategy {
            force "com.google.android.gms:play-services-location:21.3.0"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
