buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "29.0.14206865"
        kotlinVersion = "1.9.10"
        // Must be 21+ so SettingsClient/FusedLocation match device GMS (avoids IncompatibleClassChangeError).
        googlePlayServicesLocationVersion = "21.3.0"
        googlePlayServicesVersion = "21.3.0"
        playServicesLocationVersion = "21.3.0"
        playServicesVersion = "21.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }
    }
  configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion "2.1.20"
                }
            }
        }
    }
    configurations.all {
        resolutionStrategy {
            force "com.google.android.gms:play-services-location:21.3.0"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
